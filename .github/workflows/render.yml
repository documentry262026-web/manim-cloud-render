name: Render Vertical Pyramid Documentary

on:
  workflow_dispatch: 
  push:
    paths:
      - 'scene.py'   

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & LaTeX)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libcairo2-dev libpango1.0-dev texlive texlive-latex-extra

      - name: Install Manim
        run: |
          pip install manim

      - name: Render Vertical Video
        run: |
          manim -qh -r 1080,1920 scene.py PyramidMystery -o output.mp4

      - name: Send Video Directly to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Find the exact mp4 file that Manim just created
          VIDEO_FILE=$(find media/videos -name "*.mp4" | head -n 1)
          
          # Use curl to upload the file to your Discord server
          curl -H "Content-Type: multipart/form-data" \
               -F "file1=@$VIDEO_FILE" \
               -F "payload_json={\"content\": \"🎬 **New Documentary Short Ready!** Here is the Pyramid Mystery video:\"}" \
               $DISCORD_WEBHOOK

      - name: Upload to GitHub Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: pyramid-mystery-short
          path: media/videos/**/*.mp4
          retention-days: 3
