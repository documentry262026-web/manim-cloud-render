name: 5-Minute Documentary Pipeline

on:
  workflow_dispatch: 
  push:
    paths:
      - 'scene.py'   

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libcairo2-dev libpango1.0-dev texlive texlive-latex-extra

      - name: Install Python Packages
        run: |
          pip install manim google-generativeai piper-tts

      - name: Download Piper Hindi Voice Model
        run: |
          wget -qO hi.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx
          wget -qO hi.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium/hi_IN-rohan-medium.onnx.json

      - name: Generate AI Audio & Calculate Duration
        env:
          GOOGLE_API: ${{ secrets.GOOGLE_API }}
        run: |
          python generate_audio.py

      - name: Render 16:9 Landscape Video (720p for 5-min stability)
        run: |
          manim -qm scene.py PyramidDocumentary -o output.mp4

      - name: Send Video & Script to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VIDEO_FILE=$(find media/videos -name "*.mp4" | head -n 1)
          
          # Discord allows up to 25MB. A 5-min 720p mp4 usually fits.
          curl -H "Content-Type: multipart/form-data" \
               -F "file1=@$VIDEO_FILE" \
               -F "file2=@script.txt" \
               -F "payload_json={\"content\": \"🚀 **5-Minute Documentary Complete!**\\nLandscape 16:9 | Full Audio Sync | Dynamic Chapters:\"}" \
               $DISCORD_WEBHOOK
