name: Render Manim Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'scene.py'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libcairo2-dev libpango1.0-dev

      - name: Install Manim
        run: |
          pip install manim

      - name: Render Video
        run: |
          manim -qh scene.py MyFirstAnimation -o output.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finished-video
          path: media/videos/scene/1080p60/output.mp4
          retention-days: 1
